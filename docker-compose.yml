services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greenlie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: greenlie
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenlie -d greenlie']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits. worker and web wait for it to
  # succeed, so neither ever starts against a database that isn't ready.
  migrate:
    image: ghcr.io/andynet1971/greenlie-worker:${GREENLIE_TAG:-latest}
    build:
      context: .
      target: worker
    command: ['node', 'apps/worker/dist/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://greenlie:${POSTGRES_PASSWORD}@db:5432/greenlie
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/andynet1971/greenlie-worker:${GREENLIE_TAG:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://greenlie:${POSTGRES_PASSWORD}@db:5432/greenlie
      GREENLIE_CONFIG: /config/greenlie.config.yml
    volumes:
      - ./greenlie.config.yml:/config/greenlie.config.yml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/andynet1971/greenlie-web:${GREENLIE_TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: postgres://greenlie:${POSTGRES_PASSWORD}@db:5432/greenlie
      GREENLIE_CONFIG: /config/greenlie.config.yml
    volumes:
      - ./greenlie.config.yml:/config/greenlie.config.yml:ro
    healthcheck:
      # The slim image has no curl; Node itself can make the request.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
