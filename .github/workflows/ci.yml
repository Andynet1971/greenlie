name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Exercises the real-database branch of packages/db/src/testing.ts, not
      # just PGlite — the same suite, against the same kind of server as prod.
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # apps/web/src is excluded from the root typecheck (see STATO_E_ROADMAP.md,
      # Fase 3): only `next build` actually type-checks it.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write
    env:
      WORKER_IMAGE: ghcr.io/andynet1971/greenlie-worker
      WEB_IMAGE: ghcr.io/andynet1971/greenlie-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          tags: ${{ env.WORKER_IMAGE }}:latest
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          tags: ${{ env.WEB_IMAGE }}:latest
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Proves "docker compose up and it works", not just "the images build":
      # the same quickstart a clone of the repo would run, no secrets involved.
      - name: Smoke test with docker compose
        run: |
          cp examples/quickstart.yml greenlie.config.yml
          cp .env.example .env
          docker compose up -d --wait --no-build
          curl -sf http://localhost:3000/healthz
          curl -sf http://localhost:3000/ | grep -q Greenlie
          docker compose down -v

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        if: github.ref == 'refs/heads/main'
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Reuses the layers built (and GHA-cached) above — this is a push, not a rebuild.
      - uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=worker

      - uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=web
